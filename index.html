<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rica+ 業績排行榜 · 示範</title>
<style>
  :root{--navy:#172b57;--blue:#3f51b5;--indigo-soft:#edf1ff;}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    font-family:-apple-system,"PingFang HK","Microsoft YaHei",Segoe UI,sans-serif;
    background:radial-gradient(1200px 600px at 50% -10%,#223872,#0b1a3a);}
  .card{width:min(920px,92vw);background:#fff;border-radius:22px;padding:44px 36px;
    box-shadow:0 30px 80px #0006;text-align:center}
  .eyebrow{letter-spacing:3px;font-size:12px;color:#8490a3;margin:0 0 6px}
  h1{margin:0 0 6px;color:var(--navy);font-size:30px}
  p.sub{margin:0 0 30px;color:#6c788c;font-size:14px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  @media(max-width:560px){.grid{grid-template-columns:1fr}}
  a.btn{display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;
    text-decoration:none;padding:30px 18px;border-radius:16px;font-weight:700;font-size:20px;
    color:#fff;background:linear-gradient(150deg,var(--blue),#2c3d94);
    box-shadow:0 10px 24px #3f51b540;transition:transform .12s ease,box-shadow .12s ease}
  a.btn:hover{transform:translateY(-3px);box-shadow:0 16px 30px #3f51b555}
  a.btn small{font-weight:500;font-size:13px;opacity:.85}
  a.btn.mobile{background:linear-gradient(150deg,#223872,#172b57)}
  footer{margin-top:26px;font-size:12px;color:#9aa6ba}
</style>
</head>
<body>
  <div class="card">
    <p class="eyebrow">RICACORP · PERFORMANCE RANKING</p>
    <h1>業績排行榜 示範</h1>
    <p class="sub">參考網站重新設計嘅互動示範，數據為示範資料，未連接實際業績系統。</p>
    <div class="grid">
      <a class="btn" href="./web.html">🖥️ Web 版 <small>個人50強 / 團隊20強 / 個人業績 / 下屬業績</small></a>
      <a class="btn mobile" href="./mobile.html">📱 Mobile 版 <small>流動版示範</small></a>
    </div>
    <footer>RicaCorp 利嘉閣地產 · 專業成就信賴，數據成就卓越</footer>
  </div>
</body>
</html>
